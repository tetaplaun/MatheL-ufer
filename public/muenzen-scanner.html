<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>Münzen-Scanner</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff;overflow:hidden}button,input{font:inherit}.hide{display:none!important}.screen{position:fixed;inset:0}#choose{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;background:radial-gradient(circle at 50% 5%,#183d6d,#07111f 62%)}h1{margin:0 0 8px;font-size:38px}.sub{opacity:.7;margin-bottom:28px}.people{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(460px,100%)}.person{min-height:112px;border:1px solid #39516f;border-radius:23px;background:#142b49;color:#fff;font-size:23px;font-weight:800;box-shadow:0 12px 30px #0004}.person:active,.btn:active{transform:scale(.97)}#game{background:#000}video{position:absolute;width:100%;height:100%;object-fit:cover}.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:35px;text-align:center;background:radial-gradient(circle,#203d62,#05090f);color:#cbd8e8}.shade{position:absolute;inset:0;background:#0004}.top{position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 14px);left:14px;right:14px;display:flex;justify-content:space-between}.badge{padding:11px 14px;border-radius:17px;background:#000a;border:1px solid #ffffff26;font-weight:800;backdrop-filter:blur(10px)}.coin{color:#ffd43b;margin-right:7px}.frame{position:absolute;z-index:3;left:50%;top:47%;transform:translate(-50%,-50%);width:min(88vw,620px);height:min(24vh,220px);min-height:155px;border:3px solid #fff;border-radius:24px;box-shadow:0 0 0 9999px #0006}.line{position:absolute;left:18px;right:18px;top:50%;height:3px;background:#42ec8b;box-shadow:0 0 13px #42ec8b;animation:scan 1.8s ease-in-out infinite alternate}@keyframes scan{from{transform:translateY(-55px)}to{transform:translateY(55px)}}.hint{position:absolute;z-index:4;left:22px;right:22px;bottom:calc(env(safe-area-inset-bottom) + 103px);text-align:center;text-shadow:0 2px 6px #000;font-size:16px}.status{min-height:23px;margin-top:7px;color:#cfe8ff;font-weight:700}.controls{position:absolute;z-index:5;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 14px);display:grid;grid-template-columns:auto 1fr auto;gap:10px}.btn{min-height:58px;border:0;border-radius:18px;padding:12px 16px;font-weight:800}.main{background:#fff;color:#07111f}.side{background:#20324b;color:#fff;border:1px solid #ffffff1f}.round{width:58px;font-size:25px}.overlay{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:22px;background:#000c;backdrop-filter:blur(8px)}.card{width:min(430px,100%);padding:25px;border-radius:25px;background:#11223a;border:1px solid #ffffff25;text-align:center}.big{font-size:64px;font-weight:950;margin:8px}.delta{font-size:21px;font-weight:850;margin:14px 0}.good{color:#50ec9a}.bad{color:#ff8f8f}.detail{opacity:.78;line-height:1.45}.stack{display:grid;gap:10px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}.value{min-height:58px;border:1px solid #ffffff24;border-radius:16px;background:#ffffff12;color:#fff;font-size:20px;font-weight:800}.inputrow{display:grid;grid-template-columns:1fr auto;gap:9px}.inputrow input{min-width:0;height:54px;border:1px solid #ffffff2b;border-radius:15px;padding:0 14px;background:#0004;color:#fff;font-size:18px}canvas{display:none}@media(orientation:landscape) and (max-height:560px){.frame{top:43%;height:40vh;width:min(64vw,620px)}.hint{bottom:78px}.controls{grid-template-columns:auto minmax(240px,430px) auto;justify-content:center}.btn{min-height:52px}}
</style><script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script></head><body>
<section id="choose" class="screen"><h1>Wer spielt?</h1><div class="sub">Wähle eine Person aus</div><div class="people"><button class="person" data-name="Nick">Nick</button><button class="person" data-name="Tim">Tim</button><button class="person" data-name="Boco">Boco</button><button class="person" data-name="Chris">Chris</button></div></section>
<section id="game" class="screen hide"><video id="video" autoplay muted playsinline></video><div id="fallback" class="fallback hide">Kamera nicht verfügbar.<br>Du kannst unten „Manuell“ wählen.</div><div class="shade"></div><div class="top"><div class="badge"><span class="coin">●</span><span id="coins">5</span> Münzen</div><div id="who" class="badge"></div></div><div id="frame" class="frame"><div class="line"></div></div><div class="hint">Halte nur die blaue Anzeige mit <b>0.0, 1.0 …</b> in den Rahmen.<div id="status" class="status"></div></div><div class="controls"><button id="back" class="btn side round">‹</button><button id="scan" class="btn main">Ergebnis scannen</button><button id="manual" class="btn side">Manuell</button></div>
<div id="result" class="overlay hide"><div class="card"><div>Erkanntes Ergebnis</div><div id="read" class="big">0.0</div><h2 id="title">0 Fehler</h2><div id="delta" class="delta good"></div><div id="detail" class="detail"></div><div class="stack"><button id="again" class="btn main">Nächste Runde</button><button id="correct" class="btn side">Erkennung berichtigen</button></div></div></div>
<div id="manualbox" class="overlay hide"><div class="card"><h2>Ergebnis auswählen</h2><div class="grid"><button class="value" data-v="0">0.0</button><button class="value" data-v="1">1.0</button><button class="value" data-v="2">2.0</button><button class="value" data-v="3">3.0</button><button class="value" data-v="4">4.0</button><button class="value" data-v="5">5.0</button></div><div class="inputrow"><input id="other" inputmode="decimal" placeholder="z. B. 7.0"><button id="ok" class="btn main">OK</button></div><div class="stack"><button id="cancel" class="btn side">Abbrechen</button></div></div></div><canvas id="canvas"></canvas></section>
<script>
(function(){'use strict';var S=5,C=5,R=10,p='',money=5,stream=null,worker=null,workerTask=null,busy=false,last=null,charged=false;var $=function(x){return document.getElementById(x)},choose=$('choose'),game=$('game'),video=$('video'),fallback=$('fallback'),coins=$('coins'),who=$('who'),frame=$('frame'),status=$('status'),scan=$('scan'),manual=$('manual'),result=$('result'),manualbox=$('manualbox'),read=$('read'),title=$('title'),delta=$('delta'),detail=$('detail'),canvas=$('canvas');function show(x){x.classList.remove('hide')}function hide(x){x.classList.add('hide')}function key(){return'wam-coins-'+p}function load(){try{var x=localStorage.getItem(key());return x===null?S:Math.max(0,parseInt(x,10)||0)}catch(e){return S}}function save(){coins.textContent=money;try{localStorage.setItem(key(),String(money))}catch(e){}}function msg(x){status.textContent=x||''}function stop(){if(stream){stream.getTracks().forEach(function(t){t.stop()})}stream=null;video.srcObject=null}async function camera(){hide(fallback);try{if(!navigator.mediaDevices)throw Error();stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();msg('Kamera bereit')}catch(e){show(fallback);msg('Kamera nicht verfügbar – nutze „Manuell“.')}}async function pick(n){p=n;money=load();who.textContent=n;save();hide(choose);show(game);msg('Kamera wird gestartet …');camera();prepare()}document.querySelectorAll('.person').forEach(function(b){b.addEventListener('click',function(){pick(b.dataset.name)})});$('back').addEventListener('click',function(){stop();hide(game);show(choose)});function canPlay(){if(money<C){if(confirm('Du hast keine 5 Münzen mehr. Münzstand auf 5 zurücksetzen?')){money=S;save();return true}return false}return true}async function prepare(){if(worker)return worker;if(workerTask)return workerTask;if(!window.Tesseract)return null;workerTask=(async function(){try{var w=await Tesseract.createWorker('eng',1,{logger:function(m){if(busy&&m.status==='recognizing text')msg('Zahl wird erkannt … '+Math.round((m.progress||0)*100)+' %')}});await w.setParameters({tessedit_char_whitelist:'0123456789.,Oo',tessedit_pageseg_mode:Tesseract.PSM?Tesseract.PSM.SINGLE_LINE:'7'});worker=w;return w}catch(e){workerTask=null;return null}})();return workerTask}function capture(){if(!video.videoWidth)throw Error('Kamera noch nicht bereit.');var vr=video.getBoundingClientRect(),fr=frame.getBoundingClientRect(),sc=Math.max(vr.width/video.videoWidth,vr.height/video.videoHeight),dw=video.videoWidth*sc,dh=video.videoHeight*sc,ox=(vr.width-dw)/2,oy=(vr.height-dh)/2,x=(fr.left-vr.left-ox)/sc,y=(fr.top-vr.top-oy)/sc,w=fr.width/sc,h=fr.height/sc;x=Math.max(0,x);y=Math.max(0,y);w=Math.min(video.videoWidth-x,w);h=Math.min(video.videoHeight-y,h);canvas.width=1000;canvas.height=Math.round(1000*h/w);var c=canvas.getContext('2d',{willReadFrequently:true});c.drawImage(video,x,y,w,h,0,0,canvas.width,canvas.height);var im=c.getImageData(0,0,canvas.width,canvas.height),d=im.data,found=0;for(var i=0;i<d.length;i+=4){var r=d[i],g=d[i+1],b=d[i+2],on=b>95&&g>80&&b>r+22&&g>r+8;d[i]=d[i+1]=d[i+2]=on?0:255;d[i+3]=255;if(on)found++}c.putImageData(im,0,0);if(found<25)throw Error('Keine blauen Ziffern gefunden.');return canvas}function parse(t){t=String(t||'').toUpperCase().replace(/O/g,'0').replace(/,/g,'.').replace(/\s/g,'').replace(/[^0-9.]/g,'');var m=t.match(/(\d{1,2})\./);if(m)return+ m[1];var d=t.replace(/\D/g,'');if(!d)return null;if(d.length>1&&d.slice(-1)==='0')d=d.slice(0,-1)||'0';var v=parseInt(d.slice(0,2),10);return isFinite(v)?v:null}async function doScan(){if(busy||!canPlay())return;if(!stream){msg('Nutze „Manuell“, wenn die Kamera nicht läuft.');return}busy=true;scan.disabled=manual.disabled=true;msg('Foto wird ausgewertet …');try{var c=capture(),w=await prepare();if(!w)throw Error('Texterkennung konnte nicht geladen werden.');var out=await w.recognize(c),v=parse(out.data.text);if(v===null)throw Error('Zahl nicht sicher erkannt.');apply(v,false)}catch(e){msg(e.message||'Erkennung fehlgeschlagen.');openManual()}finally{busy=false;scan.disabled=manual.disabled=false}}function apply(v,fix){v=Math.max(0,Math.min(99,Math.round(Number(v))));if(!isFinite(v))return;if(!fix){if(!canPlay())return;money-=C;if(v===0)money+=R;charged=true}else if(charged&&last!==null){if(last===0)money-=R;if(v===0)money+=R;money=Math.max(0,money)}last=v;save();read.textContent=v.toFixed(1);title.textContent=v===0?'0 Fehler – perfekt!':v===1?'1 Fehler':v+' Fehler';if(v===0){delta.textContent='−5 + 10 = +5 Münzen';delta.className='delta good';detail.textContent='5 Münzen für die Runde wurden abgezogen. Für 0 Fehler bekommst du 10 Münzen zurück.'}else{delta.textContent='−5 Münzen';delta.className='delta bad';detail.textContent=v.toFixed(1)+' bedeutet '+v+(v===1?' Fehler.':' Fehler.')}hide(manualbox);show(result);msg('')}function openManual(){if(!charged&&!canPlay())return;$('other').value='';show(manualbox)}scan.addEventListener('click',doScan);manual.addEventListener('click',openManual);$('again').addEventListener('click',function(){hide(result);last=null;charged=false});$('correct').addEventListener('click',openManual);$('cancel').addEventListener('click',function(){hide(manualbox)});document.querySelectorAll('.value').forEach(function(b){b.addEventListener('click',function(){var fix=!result.classList.contains('hide')&&charged;hide(result);hide(manualbox);apply(+b.dataset.v,fix)})});function other(){var m=$('other').value.replace(',','.').match(/\d+(?:\.\d+)?/);if(m){var fix=!result.classList.contains('hide')&&charged;hide(result);hide(manualbox);apply(Math.floor(+m[0]),fix)}}$('ok').addEventListener('click',other);$('other').addEventListener('keydown',function(e){if(e.key==='Enter')other()});setTimeout(prepare,900)})();
</script></body></html>
