<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><title>Whack-a-Mole</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff;overflow:hidden}button,input,select{font:inherit}.hide{display:none!important}.screen{position:fixed;inset:0}.center{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px;background:radial-gradient(circle at 50% 0,#183d6d,#07111f 62%)}h1{margin:0 0 8px}.sub{opacity:.75;margin-bottom:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;width:min(560px,100%)}.person,.tile{min-height:78px;border:1px solid #39516f;border-radius:20px;background:#142b49;color:#fff;font-weight:800;font-size:18px}.wide{grid-column:1/-1}.btn{min-height:50px;border:0;border-radius:15px;padding:10px 14px;font-weight:800}.main{background:#fff;color:#07111f}.side{background:#20324b;color:#fff}.page{position:fixed;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 22px);background:#07111f}.head{max-width:700px;margin:auto;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:700px;margin:16px auto}.panel{background:#11223a;border:1px solid #ffffff20;border-radius:20px;padding:16px;margin-bottom:13px}.field{width:100%;height:48px;border:1px solid #ffffff30;border-radius:13px;padding:0 10px;background:#07111f;color:#fff}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail{opacity:.78;line-height:1.4}.notice{min-height:22px;margin-top:8px;font-weight:700}.price{color:#ffd43b;font-weight:800;margin-top:10px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.slot{min-height:41px;border:1px solid #ffffff25;border-radius:10px;background:#173050;color:#fff;font-size:12px;font-weight:700}.slot.sel{background:#155b42}.slot.busy{background:#4d222d}.slot.mine{background:#514313}.lux{display:flex;gap:9px;align-items:center;margin-top:11px}.overlay{position:fixed;z-index:30;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(480px,100%);max-height:90vh;overflow:auto;background:#11223a;border-radius:22px;padding:20px;text-align:center}.big{font-size:50px;font-weight:900}.section{border-top:1px solid #ffffff20;margin-top:15px;padding-top:14px}#game{background:#000}video{position:absolute;width:100%;height:100%;object-fit:cover}.shade{position:absolute;inset:0;background:#0004}.top{position:absolute;z-index:4;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.badge{padding:10px 12px;border-radius:15px;background:#000b;color:#fff;border:1px solid #ffffff25;font-weight:800}.frame{position:absolute;z-index:3;left:50%;top:47%;transform:translate(-50%,-50%);width:88vw;height:20vh;min-height:150px;border:3px solid #fff;border-radius:22px;box-shadow:0 0 0 9999px #0006}.hint{position:absolute;z-index:4;left:20px;right:20px;bottom:95px;text-align:center}.controls{position:absolute;z-index:5;left:12px;right:12px;bottom:12px;display:grid;grid-template-columns:auto 1fr;gap:9px}canvas{display:none}@media(max-width:430px){.slots{grid-template-columns:repeat(2,1fr)}}</style><script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script></head><body><section id="choose" class="screen center"><h1>Wer spielt?</h1><div class="sub">Wähle einen Account</div><div class="grid"><button class="person" data-name="Nick">🔒 Nick</button><button class="person" data-name="Tim">Tim</button><button class="person" data-name="Boco">Boco</button><button class="person" data-name="Chris">Chris</button><button class="person" data-name="Chasi">🐻 Chasi</button><button class="person" data-name="Bill">🐻 Bill</button><button class="person wide" data-name="Paddington">🐻 Paddington</button></div></section><section id="hub" class="screen center hide"><h1 id="hubName"></h1><div id="hubCoins" class="sub"></div><div class="grid"><button id="play" class="tile">🔨 Spielen</button><button id="shopBtn" class="tile">🛍️ Shop</button><button id="bookBtn" class="tile wide">🗓️ Zeit buchen</button></div><button id="logout" class="btn side" style="margin-top:16px">Zurück</button></section><section id="shop" class="page hide"><div class="head"><button id="shopBack" class="btn side">‹ Zurück</button><b>🪙 <span id="shopCoins"></span></b></div><div class="wrap"><h1>Booster-Shop</h1><div class="panel"><div class="row"><input id="mult" class="field" type="number" min="2" value="2"><input id="minutes" class="field" type="number" min="1" value="1"></div><div id="boostPrice" class="price"></div><button id="buy" class="btn main">Kaufen</button><div id="boostActive"></div></div></div></section><section id="booking" class="page hide"><div class="head"><button id="bookBack" class="btn side">‹ Zurück</button><b>🪙 <span id="bookCoins"></span></b></div><div class="wrap"><h1>Zeit buchen</h1><div class="panel"><div class="row"><select id="base" class="field"><option>Nick's Basis</option><option>Tim's Basis</option></select><input id="date" class="field" type="date"></div><label class="lux"><input id="luxury" type="checkbox"> ✨ Luxus (nur 10:00–18:00)</label><div id="bookingPrice" class="price"></div><div id="bookingMsg" class="notice"></div><button id="bookNow" class="btn main">Ausgewählte Slots buchen</button><div id="slots" class="slots"></div></div><div class="panel"><h3>Meine Buchungen</h3><div id="mine"></div></div><div class="detail">Jeder 10-Minuten-Slot kostet 1 Münze. Bei Nick's Basis bekommt Nick die Münzen, bei Tim's Basis bekommt Tim die Münzen.</div></div></section><section id="game" class="screen hide"><video id="video" autoplay muted playsinline></video><div class="shade"></div><div class="top"><button id="walletBtn" class="badge">🪙 <span id="coins"></span> · Verwalten</button><div id="who" class="badge"></div></div><div id="frame" class="frame"></div><div class="hint">Halte die blaue Anzeige in den Rahmen.<div id="status"></div></div><div class="controls"><button id="gameBack" class="btn side">‹</button><button id="scan" class="btn main">Ergebnis scannen</button></div><canvas id="canvas"></canvas></section><div id="result" class="overlay hide"><div class="card"><div id="read" class="big"></div><h2 id="resultTitle"></h2><div id="delta"></div><button id="again" class="btn main">Nächste Runde</button></div></div><div id="pass" class="overlay hide"><div class="card"><h2>Nick ist geschützt 🔒</h2><input id="pw" class="field" type="password" inputmode="numeric" maxlength="8"><div id="pwMsg"></div><button id="pwOk" class="btn main">Öffnen</button><button id="pwCancel" class="btn side">Abbrechen</button></div></div><div id="wallet" class="overlay hide"><div class="card"><h2>🪙 Münzen</h2><div id="walletBalance" class="big"></div><div class="row"><select id="giftTo" class="field"></select><input id="giftAmount" class="field" type="number"></div><button id="gift" class="btn main">Schenken</button><div id="walletMsg"></div><button id="walletClose" class="btn side">Fertig</button></div></div><script>(function(){'use strict';var P=['Nick','Tim','Boco','Chris','Chasi','Bill','Paddington'],B=['Nick','Tim','Chasi','Bill','Paddington'],player='',money=5,stream=null,worker=null,busy=false,selected=[];function $(x){return document.getElementById(x)}function show(x){x.classList.remove('hide')}function hide(x){x.classList.add('hide')}function get(n){try{var v=localStorage.getItem('wam-coins-'+n);return v===null?5:Math.max(0,parseInt(v,10)||0)}catch(e){return 5}}function set(n,v){v=Math.max(0,Math.floor(v));try{localStorage.setItem('wam-coins-'+n,String(v))}catch(e){}if(n===player){money=v;$('coins').textContent=v}}function enter(n){player=n;money=get(n);$('who').textContent=n;hide($('choose'));hub()}function hub(){stopCam();hide($('game'));hide($('shop'));hide($('booking'));$('hubName').textContent=player;$('hubCoins').textContent='🪙 '+money+' Münzen';$('bookBtn').classList.toggle('hide',B.indexOf(player)<0);show($('hub'))}document.querySelectorAll('.person').forEach(function(b){b.onclick=function(){var n=b.dataset.name;if(n==='Nick'){show($('pass'));$('pw').value=''}else enter(n)}});$('pwOk').onclick=function(){if($('pw').value==='20141114'){hide($('pass'));enter('Nick')}else $('pwMsg').textContent='Falsches Passwort'};$('pwCancel').onclick=function(){hide($('pass'))};$('logout').onclick=function(){hide($('hub'));show($('choose'))};$('play').onclick=startGame;$('shopBtn').onclick=function(){hide($('hub'));renderShop();show($('shop'))};$('shopBack').onclick=hub;$('bookBtn').onclick=openBooking;$('bookBack').onclick=hub;function boostPrice(x){x=Math.max(2,Math.floor(x));if(x===2)return 15;if(x===3)return 50;if(x===4)return 100;if(x===5)return 200;if(x===6)return 300;return 300+(x-6)*100}function boost(){try{var b=JSON.parse(localStorage.getItem('wam-boost-'+player)||'null');return b&&b.until>Date.now()?b:null}catch(e){return null}}function renderShop(){$('shopCoins').textContent=money;var m=Math.max(2,+$('mult').value||2),t=Math.max(1,+$('minutes').value||1);$('boostPrice').textContent=m+'× für '+t+' Min. = '+boostPrice(m)*t+' Münzen';var b=boost();$('boostActive').textContent=b?'Aktiv: '+b.mult+'×':''}$('mult').oninput=renderShop;$('minutes').oninput=renderShop;$('buy').onclick=function(){var m=Math.max(2,+$('mult').value||2),t=Math.max(1,+$('minutes').value||1),c=boostPrice(m)*t;if(money<c)return;set(player,money-c);localStorage.setItem('wam-boost-'+player,JSON.stringify({mult:m,until:Date.now()+t*60000}));renderShop()};function bookings(){try{return JSON.parse(localStorage.getItem('wam-bookings')||'[]')}catch(e){return[]}}function saveBookings(a){localStorage.setItem('wam-bookings',JSON.stringify(a))}function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function label(s){var e=s+10;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'–'+String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0')}function ownerFor(base){return base.indexOf("Nick")===0?'Nick':'Tim'}function openBooking(){if(B.indexOf(player)<0)return;hide($('hub'));if(!$('date').value)$('date').value=today();$('bookCoins').textContent=money;renderSlots();renderMine();show($('booking'))}function renderSlots(){selected=[];var a=bookings(),base=$('base').value,date=$('date').value,lux=$('luxury').checked,g=$('slots');g.innerHTML='';for(let s=0;s<1440;s+=10){let owner='';for(var i=0;i<a.length;i++)if(a[i].base===base&&a[i].date===date&&a[i].slots.indexOf(s)>=0){owner=a[i].player;break}var b=document.createElement('button');b.className='slot'+(owner?(owner===player?' mine':' busy'):'');b.textContent=label(s);if(owner||(lux&&(s<600||s>=1080)))b.disabled=true;else b.onclick=function(){var i=selected.indexOf(s);if(i>=0){selected.splice(i,1);b.classList.remove('sel')}else{selected.push(s);b.classList.add('sel')}$('bookingPrice').textContent=selected.length+' Slots · '+selected.length+' Münzen'};g.appendChild(b)}$('bookingPrice').textContent='0 Slots · 0 Münzen'}$('base').onchange=renderSlots;$('date').onchange=renderSlots;$('luxury').onchange=renderSlots;$('bookNow').onclick=function(){if(!selected.length)return;$('bookingMsg').textContent='';var c=selected.length;if(money<c)return $('bookingMsg').textContent='Nicht genug Münzen.';var a=bookings(),base=$('base').value,date=$('date').value,owner=ownerFor(base);for(var i=0;i<selected.length;i++)for(var j=0;j<a.length;j++)if(a[j].base===base&&a[j].date===date&&a[j].slots.indexOf(selected[i])>=0)return $('bookingMsg').textContent='Ein Slot ist schon belegt.';set(player,money-c);set(owner,get(owner)+c);a.push({id:Date.now()+Math.random(),player:player,base:base,date:date,slots:selected.slice(),luxury:$('luxury').checked,cost:c,paidTo:owner});saveBookings(a);$('bookCoins').textContent=money;$('bookingMsg').textContent='Gebucht: '+c+' Münzen an '+owner+' gezahlt.';renderSlots();renderMine()};function renderMine(){var box=$('mine'),a=bookings().filter(function(x){return x.player===player});box.innerHTML='';if(!a.length){box.innerHTML='Keine Buchungen.';return}a.forEach(function(x){var d=document.createElement('div');d.className='panel';d.innerHTML='<b>'+x.date+' · '+x.base+'</b><br>'+x.slots.map(label).join(', ')+' · '+x.cost+' Münzen';var bt=document.createElement('button');bt.className='btn side';bt.textContent='Stornieren';bt.onclick=function(){var all=bookings(),owner=x.paidTo||ownerFor(x.base);saveBookings(all.filter(function(y){return y.id!==x.id}));var refund=Math.min(x.cost,get(owner));set(owner,get(owner)-refund);set(player,money+refund);$('bookCoins').textContent=money;renderSlots();renderMine()};d.appendChild(document.createElement('br'));d.appendChild(bt);box.appendChild(d)})}function stopCam(){
