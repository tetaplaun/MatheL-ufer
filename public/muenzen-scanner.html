n(b){var d=document.createElement('div');d.className='panel';d.innerHTML='<b>'+b.date+' · '+b.base+'</b><br>'+b.slots.map(tl).join(', ')+' · '+b.cost+' Münzen';var x=document.createElement('button');x.className='btn side';x.textContent='Stornieren';x.onclick=function(){cancel(b);slots();mine();$('bookCoins').textContent=money};d.appendChild(document.createElement('br'));d.appendChild(x);box.appendChild(d)})}function openOwner(){hide($('hub'));$('ownerTitle').textContent=player+"'s Basis";renderOwner();show($('ownerPage'))}function renderOwner(){var box=$('ownerBookings'),base=player+"'s Basis",a=loads().filter(function(x){return x.base===base&&x.player!==player});box.innerHTML=a.length?'':'<div class="panel">Keine fremden Buchungen.</div>';a.forEach(function(b){var d=document.createElement('div');d.className='panel';d.innerHTML='<b>'+b.player+'</b> · '+b.date+'<br>'+b.slots.map(tl).join(', ')+' · '+b.cost+' Münzen';var x=document.createElement('button');x.className='btn danger';
