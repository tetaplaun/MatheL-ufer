<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><title>Whack-a-Mole</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07111f;color:#fff}button,input,select{font:inherit}.hide{display:none!important}.screen{position:fixed;inset:0}.center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;overflow:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(560px,100%)}button{border:0;border-radius:16px;padding:14px;font-weight:800}.person,.tile{min-height:72px;background:#142b49;color:#fff;border:1px solid #39516f}.wide{grid-column:1/-1}.main{background:#fff;color:#07111f}.side{background:#20324b;color:#fff}.good{background:#155b42;color:#fff}.danger{background:#6b2430;color:#fff}.page{position:fixed;inset:0;overflow:auto;padding:18px;background:#07111f}.head{display:flex;justify-content:space-between;align-items:center;max-width:720px;margin:auto}.wrap{max-width:720px;margin:16px auto}.panel{background:#11223a;border:1px solid #ffffff20;border-radius:18px;padding:14px;margin-bottom:12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field{width:100%;height:46px;border:1px solid #ffffff30;border-radius:12px;background:#07111f;color:#fff;padding:0 10px}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}.slot{padding:9px;background:#173050;color:#fff;font-size:12px}.slot.sel{background:#155b42}.slot.busy{background:#4d222d}.slot.mine{background:#514313}.overlay{position:fixed;z-index:20;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:min(500px,100%);max-height:90vh;overflow:auto;background:#11223a;border-radius:20px;padding:18px;text-align:center}.section{border-top:1px solid #ffffff20;margin-top:14px;padding-top:14px}.big{font-size:46px;font-weight:900}.notice{margin:8px 0;font-weight:700}.detail{opacity:.78}.badge{padding:9px 11px;border-radius:14px;background:#000b;color:#fff}.top{position:absolute;z-index:3;top:12px;left:12px;right:12px;display:flex;justify-content:space-between}.frame{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:88vw;height:22vh;border:3px solid #fff;border-radius:20px;box-shadow:0 0 0 9999px #0007}.hint{position:absolute;z-index:3;bottom:90px;left:15px;right:15px;text-align:center}.controls{position:absolute;z-index:3;bottom:12px;left:12px;right:12px;display:grid;grid-template-columns:auto 1fr;gap:8px}video{position:absolute;width:100%;height:100%;object-fit:cover}canvas{display:none}@media(max-width:430px){.slots{grid-template-columns:repeat(2,1fr)}}</style><script defer src="https://cdn.jsdelivr.net/npm/tesseract.js@7/dist/tesseract.min.js"></script></head><body><section id="choose" class="screen center"><h1>Wer spielt?</h1><p class="detail">Wähle einen Account</p><div class="grid"><button class="person" onclick="pick('Nick')">🔒 Nick</button><button class="person" onclick="pick('Tim')">Tim</button><button class="person" onclick="pick('Boco')">Boco</button><button class="person" onclick="pick('Chris')">Chris</button><button class="person" onclick="pick('Chasi')">🐻 Chasi</button><button class="person" onclick="pick('Bill')">🐻 Bill</button><button class="person wide" onclick="pick('Paddington')">🐻 Paddington</button></div></section><section id="hub" class="screen center hide"><h1 id="hubName"></h1><p id="hubCoins"></p><div class="grid"><button id="play" class="tile">🔨 Spielen</button><button id="shopBtn" class="tile">🛍️ Shop</button><button id="bookBtn" class="tile">🗓️ Zeit buchen</button><button id="coinsBtn" class="tile">🪙 Münzen</button><button id="manageBtn" class="tile wide hide">🏠 Basis-Buchungen verwalten</button></div><button id="logout" class="side" style="margin-top:12px">Zurück</button></section><section id="shop" class="page hide"><div class="head"><button id="shopBack" class="side">‹ Zurück</button><b>🪙 <span id="shopCoins"></span></b></div><div class="wrap"><div class="panel"><h1>Booster-Shop</h1><div class="row"><input id="mult" class="field" type="number" min="2" value="2"><input id="mins" class="field" type="number" min="1" value="1"></div><p id="boostPrice"></p><button id="buy" class="main">Kaufen</button></div></div></section><section id="booking" class="page hide"><div class="head"><button id="bookBack" class="side">‹ Zurück</button><b>🪙 <span id="bookCoins"></span></b></div><div class="wrap"><div class="panel"><h1>Zeit buchen</h1><div class="row"><select id="base" class="field"><option>Nick's Basis</option><option>Tim's Basis</option></select><input id="date" class="field" type="date"></div><p><label><input id="lux" type="checkbox"> ✨ Luxus, nur 10:00–18:00</label></p><p id="bookPrice"></p><div id="bookMsg" class="notice"></div><button id="bookNow" class="main">Ausgewählte Slots buchen</button><div id="slots" class="slots"></div></div><div class="panel"><h3>Meine Buchungen</h3><div id="mine"></div></div></div></section><section id="owner" class="page hide"><div class="head"><button id="ownerBack" class="side">‹ Zurück</button><b id="ownerTitle"></b></div><div class="wrap"><h1>Buchungen meiner Basis</h1><p class="detail">Du kannst Buchungen kündigen. Der Buchende bekommt die Münzen zurück.</p><div id="ownerList"></div></div></section><section id="game" class="screen hide"><video id="video" autoplay muted playsinline></video><div class="top"><button id="walletBtn" class="badge">🪙 <span id="coins"></span></button><div id="who" class="badge"></div></div><div id="frame" class="frame"></div><div class="hint">Halte 0.0, 1.0 … in den Rahmen.<div id="status"></div></div><div class="controls"><button id="gameBack" class="side">‹</button><button id="scan" class="main">Ergebnis scannen</button></div><canvas id="canvas"></canvas></section><div id="result" class="overlay hide"><div class="card"><div id="read" class="big"></div><h2 id="resultTitle"></h2><p id="delta"></p><button id="again" class="main">Nächste Runde</button></div></div><div id="pass" class="overlay hide"><div class="card"><h2>Nick 🔒</h2><input id="pw" class="field" type="password" inputmode="numeric" placeholder="Passwort"><div id="pwMsg" class="notice"></div><button id="pwOk" class="main">Öffnen</button><button id="pwCancel" class="side">Abbrechen</button></div></div><div id="wallet" class="overlay hide"><div class="card"><h2>🪙 Münzen</h2><div id="walletBalance" class="big"></div><div class="section"><div class="row"><select id="giftTo" class="field"></select><input id="giftAmount" class="field" type="number" min="1" placeholder="Anzahl"></div><button id="gift" class="main">Schenken</button></div><div id="nickAdmin" class="section hide"><h3>Nick-Verwaltung</h3><div class="row"><select id="adminPerson" class="field"></select><input id="adminAmount" class="field" type="number" min="1" placeholder="Anzahl"></div><div class="row"><button id="adminGive" class="good">Geben</button><button id="adminTake" class="danger">Wegnehmen</button></div></div><div id="walletMsg" class="notice"></div><button id="walletClose" class="side">Fertig</button></div></div><script>const P=['Nick','Tim','Boco','Chris','Chasi','Bill','Paddington'];let player='',money=5,selected=[],stream=null,worker=null,busy=false;const $=x=>document.getElementById(x),show=x=>x.classList.remove('hide'),hide=x=>x.classList.add('hide');function get(n){try{let v=localStorage.getItem('wam-coins-'+n);return v===null?5:Math.max(0,parseInt(v)||0)}catch(e){return 5}}function set(n,v){v=Math.max(0,Math.floor(v));try{localStorage.setItem('wam-coins-'+n,v)}catch(e){}if(n===player){money=v;$('coins').textContent=v}}function pick(n){if(n==='Nick'){show($('pass'));$('pw').value='';return}enter(n)}window.pick=pick;function enter(n){player=n;money=get(n);$('who').textContent=n;hide($('choose'));hub()}function hub(){stopCam();['game','shop','booking','owner'].forEach(x=>hide($(x)));$('hubName').textContent=player;$('hubCoins').textContent='🪙 '+money+' Münzen';$('manageBtn').classList.toggle('hide',!['Nick','Tim'].includes(player));show($('hub'))}$('pwOk').onclick=()=>{$('pw').value==='20141114'?(hide($('pass')),enter('Nick')):$('pwMsg').textContent='Falsches Passwort'};$('pwCancel').onclick=()=>hide($('pass'));$('logout').onclick=()=>{hide($('hub'));show($('choose'))};$('play').onclick=()=>{hide($('hub'));show($('game'));startCam();prep()};$('gameBack').onclick=hub;$('shopBtn').onclick=()=>{hide($('hub'));renderShop();show($('shop'))};$('shopBack').onclick=hub;$('bookBtn').onclick=openBooking;$('bookBack').onclick=hub;$('manageBtn').onclick=openOwner;$('ownerBack').onclick=hub;function bp(m){m=Math.max(2,Math.floor(m));return m===2?15:m===3?50:m===4?100:m===5?200:m===6?300:300+(m-6)*100}function renderShop(){$('shopCoins').textContent=money;let m=Math.max(2,+$('mult').value||2),t=Math.max(1,+$('mins').value||1);$('boostPrice').textContent=m+'× für '+t+' Min. = '+bp(m)*t+' Münzen'}$('mult').oninput=renderShop;$('mins').oninput=renderShop;$('buy').onclick=()=>{let m=Math.max(2,+$('mult').value||2),t=Math.max(1,+$('mins').value||1),c=bp(m)*t;if(money<c)return alert('Nicht genug Münzen.');set(player,money-c);localStorage.setItem('wam-boost-'+player,JSON.stringify({mult:m,until:Date.now()+t*60000}));renderShop()};function loads(){try{return JSON.parse(localStorage.getItem('wam-bookings')||'[]')}catch(e){return[]}}function saves(a){try{localStorage.setItem('wam-bookings',JSON.stringify(a))}catch(e){}}function day(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function tl(s){let e=s+10;return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'–'+String(Math.floor(e/60)).padStart(2,'0')+':'+String(e%60).padStart(2,'0')}function baseOwner(b){return b.startsWith('Nick')?'Nick':'Tim'}function openBooking(){hide($('hub'));if(!$('date').value)$('date').value=day();$('bookCoins').textContent=money;renderSlots();renderMine();show($('booking'))}function renderSlots(){selected=[];let all=loads(),base=$('base').value,date=$('date').value,lux=$('lux').checked,box=$('slots');box.innerHTML='';for(let s=0;s<1440;s+=10){let rec=all.find(x=>x.base===base&&x.date===date&&x.slots.includes(s)),b=document.createElement('button');b.className='slot'+(rec?(rec.player===player?' mine':' busy'):'');b.textContent=tl(s);b.disabled=!!rec||(lux&&(s<600||s>=1080));if(!b.disabled)b.onclick=()=>{let i=selected.indexOf(s);i<0?(selected.push(s),b.classList.add('sel')):(selected.splice(i,1),b.classList.remove('sel'));price()};box.appendChild(b)}price()}function price(){$('bookPrice').textContent=selected.length+' Slots · '+selected.length+' Münzen'}$('base').onchange=renderSlots;$('date').onchange=renderSlots;$('lux').onchange=renderSlots;$('bookNow').onclick=()=>{let c=selected.length;if(!c)return;if(money<c)return $('bookMsg').textContent='Nicht genug Münzen.';let all=loads(),base=$('base').value,o=baseOwner(base);set(player,money-c);set(o,get(o)+c);all.push({id:Date.now()+Math.random(),player,base,date:$('date').value,slots:[...selected],cost:c,paidTo:o,luxury:$('lux').checked});saves(all);$('bookCoins').textContent=money;$('bookMsg').textContent='Gebucht.';renderSlots();renderMine()};function refund(b){let all=loads(),o=b.paidTo||baseOwner(b.base);saves(all.filter(x=>x.id!==b.id));set(o,Math.max(0,get(o)-b.cost));set(b.player,get(b.player)+b.cost)}function renderMine(){let box=$('mine'),a=loads().filter(x=>x.player===player);box.innerHTML=a.length?'':'Keine Buchungen.';a.forEach(b=>{let d=document.createElement('div');d.className='panel';d.innerHTML='<b>'+b.date+' · '+b.base+'</b><br>'+b.slots.map(tl).join(', ')+' · '+b.cost+' Münzen';let x=document.createElement('button');x.className='side';x.textContent='Stornieren';x.onclick=()=>{refund(b);renderSlots();renderMine();$('bookCoins').textContent=money};d.appendChild(document.createElement('br'));d.appendChild(x);box.appendChild(d)})}function openOwner(){hide($('hub'));$('ownerTitle').textContent=player+"'s Basis";renderOwner();show($('owner'))}function renderOwner(){let base=player+"'s Basis",a=loads().filter(x=>x.base===base&&x.player!==player),box=$('ownerList');box.innerHTML=a.length?'':'<div class="panel">Keine fremden Buchungen.</div>';a.forEach(b=>{let d=document.createElement('div');d.className='panel';d.innerHTML='<b>'+b.player+'</b> · '+b.date+'<br>'+b.slots.map(tl).join(', ')+' · '+b.cost+' Münzen';let x=document.createElement('button');x.className='danger';x.textContent='Buchung kündigen';x.onclick=()=>{refund(b);renderOwner()};d.appendChild(document.createElement('br'));d.appendChild(x);box.appendChild(d)})}function fill(id,self=false){let s=$(id);s.innerHTML='';P.filter(n=>self||n!==player).forEach(n=>{let o=document.createElement('option');o.value=n;o.textContent=n+' ('+get(n)+')';s.appendChild(o)})}function openWallet(){stopCam();$('walletBalance').textContent=money;fill('giftTo');fill('adminPerson',true);$('nickAdmin').classList.toggle('hide',player!=='Nick');show($('wallet'))}$('coinsBtn').onclick=openWallet;$('walletBtn').onclick=openWallet;$('walletClose').onclick=()=>{hide($('wallet'));hub()};$('gift').onclick=()=>{let n=$('giftTo').value,a=Math.floor(+$('giftAmount').value);if(!a||a>money)return;$('walletMsg').textContent=a+' Münzen geschenkt.';set(player,money-a);set(n,get(n)+a);$('walletBalance').textContent=money};$('adminGive').onclick=()=>{if(player!=='Nick')return;let n=$('adminPerson').value,a=Math.floor(+$('adminAmount').value);if(a>0)set(n,get(n)+a);$('walletBalance').textContent=money};$('adminTake').onclick=()=>{if(player!=='Nick')return;let n=$('adminPerson').value,a=Math.floor(+$('adminAmount').value);if(a>0)set(n,get(n)-Math.min(a,get(n)));$('walletBalance').textContent=money};function stopCam(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null}async function startCam(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});$('video').srcObject=stream;await $('video').play();$('status').textContent='Kamera bereit'}catch(e){$('status').textContent='Kamerazugriff fehlt.'}}async function prep(){if(worker)return worker;if(!window.Tesseract)return null;try{worker=await Tesseract.createWorker('eng',1);await worker.setParameters({tessedit_char_whitelist:'0123456789.,Oo'});return worker}catch(e){return null}}function active(){try{let b=JSON.parse(localStorage.getItem('wam-boost-'+player)||'null');return b&&b.until>Date.now()?b:null}catch(e){return null}}function parse(t){let s=String(t||'').toUpperCase().replace(/O/g,'0').replace(/,/g,'.'),m=s.match(/(\d{1,2})\./);return m?+m[1]:null}function capture(){let v=$('video'),c=$('canvas');if(!v.videoWidth)throw 0;c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);return c}$('scan').onclick=async function(){if(busy||money<5)return;busy=true;try{let w=await prep(),o=await w.recognize(capture()),v=parse(o.data.text);if(v===null)throw 0;let reward=Math.max(0,10-v),b=active(),gain=reward*(b?b.mult:1);set(player,money-5+gain);$('read').textContent=v.toFixed(1);$('resultTitle').textContent=v+' Fehler';$('delta').textContent='−5 + '+gain+' Münzen';show($('result'))}catch(e){$('status').textContent='Nicht erkannt. Noch einmal scannen.'}busy=false};$('again').onclick=()=>hide($('result'));</script></body></html>
